[project]
name = "invoice-automation"
version = "0.1.0"
description = "Turns scanned supplier invoices into PowerSoft-ready Excel files for The Plug Business Center."
authors = [
    { name = "Zein Said", email = "92037684+Zein2002@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2",
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
invoice-automation = "invoice_automation:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
